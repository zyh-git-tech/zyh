name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py agent_service.py image_service.py knowledge_graph_service.py models.py predictive_service.py standards_service.py vector_service.py
      - name: Run smoke test
        run: python smoke_test.py
      - name: Check staged-style whitespace
        run: git diff --check
      - name: Audit tracked release files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(maintenance\.db|.*\.sqlite3?|摩托车发动机维修手册\.pdf|build/|\.venv/|static/uploads/[^.]|.*\.log$)'; then
            echo "A local-only file is tracked"
            exit 1
          fi
