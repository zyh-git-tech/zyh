services:
  - type: web
    name: gongjing-zhiwei-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 300 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.3.1
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gongjing-zhiwei-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: LLM_API_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      - key: LLM_MODEL
        value: qwen-plus
      - key: LLM_PROVIDER
        value: qwen
databases:
  - name: gongjing-zhiwei-db
    plan: free
    databaseName: gongjing_zhiwei
    user: gongjing_zhiwei
