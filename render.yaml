services:
  - type: web
    name: gongjing-zhiwei-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: APP_VERSION
        value: 0.3.1
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///maintenance.db
