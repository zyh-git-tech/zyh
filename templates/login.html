{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<main class="login-shell">
  <section class="login-panel">
    <div class="login-mark" aria-hidden="true">◈</div>
    <p class="eyebrow">INDUSTRIAL COPILOT</p>
    <h1>登录工擎智维</h1>
    <p class="login-subtitle">进入工业设备多模态检修工作台</p>
    <form method="post" class="login-form">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="form-label" for="username">用户名</label>
      <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      <div id="rememberedAccounts" class="remembered-accounts" hidden>
        <span class="remembered-label">最近登录</span>
        <div id="accountList" class="account-list"></div>
      </div>
      <label class="form-label" for="password">密码</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block" type="submit">登录工作台</button>
    </form>
    <p class="login-switch">还没有账号？<a href="{{ url_for('register') }}">注册账号</a></p>
    <p class="login-footnote">本地可信模式 · 受保护的设备检修数据</p>
  </section>
</main>
<script>
(() => {
  const key = "gongjing_recent_accounts";
  const form = document.querySelector(".login-form");
  const username = document.getElementById("username");
  const password = document.getElementById("password");
  const wrap = document.getElementById("rememberedAccounts");
  const list = document.getElementById("accountList");
  let accounts = [];
  try { accounts = JSON.parse(localStorage.getItem(key) || "[]"); } catch (_) { accounts = []; }
  accounts = [...new Set(accounts.filter(item => typeof item === "string" && item.length))].slice(0, 6);
  if (accounts.length) {
    wrap.hidden = false;
    accounts.forEach(account => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "account-chip";
      button.textContent = account;
      button.addEventListener("click", () => { username.value = account; password.focus(); });
      list.appendChild(button);
    });
  }
  form.addEventListener("submit", () => {
    const account = username.value.trim();
    if (!account) return;
    accounts = [account, ...accounts.filter(item => item !== account)].slice(0, 6);
    localStorage.setItem(key, JSON.stringify(accounts));
  });
})();
</script>
{% endblock %}
