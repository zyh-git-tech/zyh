{% extends "base.html" %}
{% block title %}案例回填{% endblock %}
{% block top_title %}一线经验结构化沉淀{% endblock %}
{% block content %}
<div class="page-head"><div><h1>检修案例回填</h1><p>把师傅经验变成可审核、可检索、可复用的企业知识资产。</p></div><span class="badge purple">持续学习入口</span></div>
<div class="split"><section class="panel"><div class="panel-head"><h2>案例信息</h2></div><div class="panel-body"><form method="post" enctype="multipart/form-data"><div class="form-group"><label class="form-label">案例标题</label><input class="input" name="title" required placeholder="例如：冷机启动困难与火花塞积碳排查"></div><div class="grid grid-2"><div class="form-group"><label class="form-label">设备型号</label><input class="input" name="device_model" required></div><div class="form-group"><label class="form-label">现场图片</label><input class="input" type="file" name="case_image" accept="image/*"></div></div><div class="form-group"><label class="form-label">故障现象与实测数据</label><textarea class="textarea" name="fault_description" required></textarea></div><div class="form-group"><label class="form-label">最终原因与闭环对策</label><textarea class="textarea" name="solution" required></textarea></div><button class="btn btn-success btn-block">提交专家审核</button></form></div></section><aside class="panel"><div class="panel-head"><h3>知识治理流程</h3></div><div class="panel-body"><div class="timeline"><div class="timeline-item"><span class="timeline-dot"></span><strong>一线上报</strong><div class="hint">现象、图片、数据和处置结果</div></div><div class="timeline-item"><span class="timeline-dot"></span><strong>专家审核</strong><div class="hint">校验真实性、规范性和复用价值</div></div><div class="timeline-item"><span class="timeline-dot"></span><strong>实时入库</strong><div class="hint">审核通过即进入 RAG 检索范围</div></div><div class="timeline-item"><span class="timeline-dot"></span><strong>效果反馈</strong><div class="hint">纠偏样本进入持续学习语料池</div></div></div></div></aside></div>
{% endblock %}
