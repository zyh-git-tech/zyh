[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["build", "dist", ".venv", "static/uploads"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
omit = ["smoke_test.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true
